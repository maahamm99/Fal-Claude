<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PakGuide — government paperwork, decoded</title>
<style>
@font-face { font-family: "News"; font-weight: 400; src: url(fonts/newsreader-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "News"; font-weight: 400; font-style: italic; src: url(fonts/newsreader-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "News"; font-weight: 600; src: url(fonts/newsreader-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "News"; font-weight: 700; src: url(fonts/newsreader-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Type"; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Type"; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Type"; font-weight: 600; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Naskh"; font-weight: 400; src: url(fonts/noto-naskh-arabic-arabic-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Naskh"; font-weight: 600; src: url(fonts/noto-naskh-arabic-arabic-600-normal.woff2) format("woff2"); }

:root {
  --ink: #0E3B24;        /* green ink */
  --ink-2: #2E5A42;
  --pencil: #6E6A5E;
  --paper: #F3EEDF;
  --sheet: #FBF8EE;
  --rule: #DCD3BC;
  --margin: #C9483A;     /* copybook margin red */
  --folder: #D8C59A;
  --folder-dk: #C4AE7E;
  --stamp: #1F7A47;
  --stamp-red: #B33A2E;
  --hi: #F4E27A;         /* highlighter */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "News", Georgia, serif; color: var(--ink); background: var(--paper);
  background-image:
    radial-gradient(rgba(120,100,60,0.06) 1px, transparent 1px),
    radial-gradient(rgba(120,100,60,0.04) 1px, transparent 1px);
  background-size: 7px 7px, 13px 13px; background-position: 0 0, 3px 5px;
  -webkit-font-smoothing: antialiased;
}
.type { font-family: "Type", ui-monospace, monospace; }
.ur { font-family: "Naskh", serif; direction: rtl; text-align: right; }

/* ---------- masthead ---------- */
.mast { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 24px; padding: 22px 40px 14px; border-bottom: 3px double var(--ink); }
.mast .name { display: flex; align-items: center; gap: 12px; }
.mast .name b { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.mast .name small { display: block; font-family: "Type"; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pencil); margin-top: 5px; }
.mast .mid { font-family: "Type"; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pencil); text-align: center; padding-bottom: 4px; }
.lang { display: flex; align-items: center; gap: 0; font-family: "Type"; font-size: 12px; }
.lang span { padding: 4px 10px; border: 1.5px solid var(--ink); color: var(--ink); }
.lang span + span { border-left: none; }
.lang span.on { background: var(--ink); color: var(--sheet); }
.lang .u { font-family: "Naskh"; font-size: 15px; line-height: 1; padding: 3px 10px 5px; }

/* ---------- folder tabs ---------- */
.tabs { display: flex; gap: 4px; padding: 18px 40px 0; align-items: flex-end; overflow: hidden; }
.tab { background: var(--folder); color: #4D3F22; font-family: "Type"; font-size: 12px; padding: 9px 22px 8px 16px; clip-path: polygon(0 100%, 0 18%, 6% 0, 88% 0, 100% 100%); white-space: nowrap; }
.tab b { font-weight: 600; margin-right: 6px; }
.tab.on { background: var(--sheet); color: var(--ink); padding-top: 12px; position: relative; z-index: 2; }
.tab.add { background: transparent; color: var(--pencil); clip-path: none; border: 1.5px dashed var(--folder-dk); padding: 7px 14px; margin-left: 6px; }
.tab .ur { font-size: 14px; }

/* ---------- the sheet ---------- */
.sheet { position: relative; background: var(--sheet); margin: 0 40px; height: calc(100vh - 152px); box-shadow: 0 1px 0 var(--rule), 0 18px 30px -24px rgba(60,45,10,0.45); overflow: hidden; }
.sheet:before { content: ""; position: absolute; top: 0; bottom: 0; left: 96px; width: 1.5px; background: var(--margin); opacity: 0.7; }
.lined { background-image: repeating-linear-gradient(transparent 0 31px, rgba(150,170,190,0.22) 31px 32px); }
.inner { position: relative; padding: 26px 48px 0 128px; height: 100%; display: flex; flex-direction: column; }
.entry { position: relative; }
.mlabel { position: absolute; left: -110px; width: 86px; text-align: right; font-family: "Type"; font-size: 11px; color: var(--pencil); line-height: 1.4; letter-spacing: 0.04em; }
.mlabel b { display: block; font-size: 22px; color: var(--margin); font-family: "News"; font-weight: 700; letter-spacing: 0; }

.q { font-family: "Type"; font-size: 16px; line-height: 1.6; color: #22201A; padding: 2px 0 10px; border-bottom: 1.5px solid #22201A; max-width: 640px; }
.q.ur { font-family: "Naskh"; font-size: 22px; line-height: 1.7; padding-bottom: 6px; }
.a { margin-top: 22px; font-size: 18px; line-height: 1.55; max-width: 720px; color: #233B2E; }
.a p { margin: 0 0 14px; }
.hl { background: linear-gradient(transparent 55%, var(--hi) 55% 92%, transparent 92%); padding: 0 2px; }

/* form-style step table */
.form { border: 1.5px solid var(--ink); margin: 6px 0 18px; font-size: 15.5px; }
.form .cap { display: flex; justify-content: space-between; font-family: "Type"; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1.5px solid var(--ink); background: rgba(14,59,36,0.06); }
.form .r { display: grid; grid-template-columns: 44px 1fr 150px; border-bottom: 1px solid var(--rule); }
.form .r:last-child { border-bottom: none; }
.form .r > div { padding: 8px 10px; }
.form .r > div + div { border-left: 1px solid var(--rule); }
.form .no { font-family: "Type"; font-size: 13px; color: var(--margin); text-align: center; }
.form .w { font-family: "Type"; font-size: 12px; color: var(--pencil); }

/* hand-ticked list */
.ticks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; margin: 4px 0 18px; padding: 0; list-style: none; font-size: 16.5px; }
.ticks li { display: flex; gap: 10px; align-items: flex-start; }
.sq { width: 18px; height: 18px; border: 1.5px solid var(--ink); flex-shrink: 0; margin-top: 4px; position: relative; }
.sq svg { position: absolute; left: -2px; top: -7px; }

/* receipt */
.receipt { font-family: "Type"; font-size: 13px; width: 300px; background: #fff; padding: 14px 16px 18px; color: #2C2A24; box-shadow: 0 1px 2px rgba(0,0,0,0.08); position: relative;
  -webkit-mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 100% / 12px 12px repeat-x, linear-gradient(#000, #000) 0 0 / 100% calc(100% - 6px) no-repeat;
          mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 100% / 12px 12px repeat-x, linear-gradient(#000, #000) 0 0 / 100% calc(100% - 6px) no-repeat; }
.receipt .t { text-align: center; letter-spacing: 0.14em; font-size: 11px; margin-bottom: 8px; }
.lead { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
.lead i { flex: 1; border-bottom: 1.5px dotted #9C978A; transform: translateY(-3px); }

/* token slip */
.slip { display: flex; background: #EAF1E4; border: 1.5px solid var(--ink); width: 430px; transform: rotate(-1.2deg); }
.slip .l { padding: 12px 16px; flex: 1; border-right: 2px dashed var(--ink); }
.slip .l b { font-size: 17px; display: block; }
.slip .l span { font-family: "Type"; font-size: 11.5px; color: var(--ink-2); }
.slip .r { width: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Type"; }
.slip .r small { font-size: 9.5px; letter-spacing: 0.12em; }
.slip .r b { font-size: 26px; font-weight: 600; letter-spacing: 0.02em; }

/* rubber stamp */
.stamp { position: absolute; border: 3px solid var(--stamp); color: var(--stamp); border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: "Type"; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.78; mix-blend-mode: multiply; }
.stamp:after { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; border-radius: 50%; }
.stamp.red { color: var(--stamp-red); border-color: var(--stamp-red); }
.stamp.rect { border-radius: 4px; }
.stamp.rect:after { border-radius: 2px; }

.margin-note { font-family: "News"; font-style: italic; font-size: 15px; color: var(--stamp-red); }
.next { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: "Type"; font-size: 13px; margin-top: 10px; }
.next span { border-bottom: 1.5px solid var(--ink); padding-bottom: 1px; }
.next span:before { content: "→ "; color: var(--margin); }

/* write box */
.write { margin-top: auto; padding: 14px 0 20px; display: flex; align-items: flex-end; gap: 16px; max-width: 760px; }
.write .field { flex: 1; border-bottom: 2px solid var(--ink); padding: 6px 2px; font-family: "Type"; font-size: 15px; color: #8E887A; display: flex; justify-content: space-between; }
.write .btn { background: var(--ink); color: var(--sheet); font-family: "Type"; font-size: 12.5px; letter-spacing: 0.1em; padding: 11px 18px; text-transform: uppercase; }
.write .field .ur { font-size: 18px; color: #8E887A; }

/* ---------- front page ---------- */
.front { padding: 34px 40px 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 0 46px; height: calc(100vh - 92px); overflow: hidden; }
.kicker { font-family: "Type"; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--margin); }
.front h1 { font-size: 66px; line-height: 0.98; letter-spacing: -0.03em; margin: 12px 0 18px; font-weight: 700; }
.front h1 em { font-style: italic; font-weight: 400; }
.front .deck { font-size: 20px; line-height: 1.45; color: var(--ink-2); max-width: 560px; margin: 0 0 26px; }
.ask { border: 2px solid var(--ink); background: var(--sheet); padding: 16px 18px 14px; position: relative; max-width: 620px; }
.ask small { position: absolute; top: -9px; left: 12px; background: var(--paper); padding: 0 6px; font-family: "Type"; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; }
.ask .line { font-family: "Type"; font-size: 17px; color: #22201A; border-bottom: 1.5px dotted #8E887A; padding-bottom: 6px; }
.ask .line i { font-style: normal; color: #A49E90; }
.ask .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-family: "Type"; font-size: 12px; color: var(--pencil); }
.ask .row b { background: var(--ink); color: var(--sheet); padding: 8px 14px; letter-spacing: 0.1em; font-weight: 500; }
.toc { border-left: 1.5px solid var(--ink); padding-left: 28px; }
.toc h3 { font-family: "Type"; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin: 6px 0 12px; font-weight: 600; }
.toc .sec { font-family: "Type"; font-size: 11px; letter-spacing: 0.12em; color: var(--margin); margin: 16px 0 4px; text-transform: uppercase; }
.toc .it { display: flex; gap: 8px; align-items: baseline; font-size: 18px; padding: 3px 0; }
.toc .it i { flex: 1; border-bottom: 1.5px dotted #A9A291; transform: translateY(-4px); }
.toc .it span { font-family: "Type"; font-size: 12px; color: var(--pencil); }
.clip { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 700px; border-top: 1.5px solid var(--ink); padding-top: 12px; }
.clip div { font-size: 15.5px; line-height: 1.4; }
.clip div small { display: block; font-family: "Type"; font-size: 10.5px; letter-spacing: 0.1em; color: var(--pencil); text-transform: uppercase; margin-bottom: 4px; }

.notices { display: flex; gap: 22px; margin-top: 34px; max-width: 700px; align-items: stretch; }
.nt { flex: 1; background: #fff; padding: 12px 14px; font-size: 15px; line-height: 1.4; border-top: 4px solid var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
.nt:nth-child(2) { transform: rotate(0.8deg); }
.nt small { display: block; font-family: "Type"; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--margin); margin-bottom: 4px; }
.toc-foot { margin-top: 22px; font-size: 12px; color: var(--pencil); border-top: 1.5px dotted #A9A291; padding-top: 10px; }
.docs { display: flex; gap: 18px; margin-top: 30px; }
.doc { width: 130px; height: 160px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 12px; position: relative; font-family: "Type"; font-size: 10px; color: var(--pencil); }
.doc b { display: block; margin-top: 14px; font-family: "News"; font-size: 14px; color: var(--ink); margin-bottom: 8px; }
.doc i { display: block; height: 5px; background: #E7E1D0; margin: 6px 0; }
.doc .clipr { position: absolute; top: -10px; left: 18px; width: 14px; height: 34px; border: 2px solid #8C8C8C; border-radius: 7px; }

/* ---------- checklist ---------- */
.ledger { display: grid; grid-template-columns: 1fr 300px; gap: 40px; padding-top: 4px; }
.lrow { display: grid; grid-template-columns: 34px 1fr 120px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); position: relative; font-size: 18px; }
.lrow .n { font-family: "Type"; font-size: 13px; color: var(--margin); }
.lrow small { display: block; font-family: "Type"; font-size: 12px; color: var(--pencil); margin-top: 2px; }
.lrow.done .t { text-decoration: line-through; text-decoration-color: rgba(14,59,36,0.55); text-decoration-thickness: 1.5px; color: #5E7366; }
.lrow .st { font-family: "Type"; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; text-align: right; }
.tally { font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.tally span { font-size: 30px; color: var(--pencil); font-weight: 400; }

/* ---------- phone ---------- */
@media (max-width: 600px) {
  .notices { display: none; }
  .mast { grid-template-columns: 1fr auto; padding: 16px 18px 10px; }
  .mast .mid { display: none; }
  .mast .name b { font-size: 26px; }
  .tabs { padding: 12px 12px 0; }
  .tab { font-size: 11px; padding: 8px 16px 7px 12px; }
  .sheet { margin: 0 10px; height: calc(100vh - 128px); }
  .sheet:before { left: 30px; }
  .inner { padding: 18px 16px 0 44px; }
  .mlabel { left: -42px; width: 30px; font-size: 0; }
  .mlabel b { font-size: 18px; }
  .q { font-size: 14.5px; }
  .a { font-size: 16.5px; margin-top: 16px; }
  .form .r { grid-template-columns: 30px 1fr; }
  .form .r > div:nth-child(3) { display: none; }
  .ticks { grid-template-columns: 1fr; font-size: 15.5px; }
  .slip { width: 100%; }
  .receipt { width: 100%; }
  .front { grid-template-columns: 1fr; padding: 22px 18px; height: auto; }
  .front h1 { font-size: 42px; }
  .front .deck { font-size: 17px; }
  .toc { border-left: none; border-top: 1.5px solid var(--ink); padding: 10px 0 0; margin-top: 26px; }
  .clip { display: none; }
  .write .btn { padding: 10px 12px; }
  .hide-m { display: none !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
let lid = 0;
function logo(size, onDark) {
  const g = onDark ? "#FBF8EE" : "#0E3B24", w = onDark ? "#0E3B24" : "#FBF8EE", k = "pg" + (lid++);
  const pin = "M24 2.5c-9.6 0-17.2 7.5-17.2 16.9C6.8 31.6 24 45.5 24 45.5s17.2-13.9 17.2-26.1C41.2 10 33.6 2.5 24 2.5z";
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-label="PakGuide logo">
    <defs><clipPath id="${k}p"><path d="${pin}"/></clipPath>
    <mask id="${k}m"><rect width="48" height="48" fill="#fff"/><circle cx="30.4" cy="16.6" r="7.3" fill="#000"/></mask></defs>
    <g clip-path="url(#${k}p)"><rect width="48" height="48" fill="${g}"/><rect width="15.5" height="48" fill="${w}"/></g>
    <path d="${pin}" fill="none" stroke="${g}" stroke-width="1.4"/>
    <circle cx="27.6" cy="19.6" r="8.6" fill="${w}" mask="url(#${k}m)"/>
    <path transform="translate(32.2 14.6) rotate(18) scale(.62)" d="M0-5l1.18 3.38 3.58.07-2.85 2.17 1.03 3.43L0 2.02l-2.94 2.03 1.03-3.43-2.85-2.17 3.58-.07z" fill="${w}"/></svg>`;
}
// hand-drawn tick, slightly different each time
let seed = 3;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
function tick() {
  const a = 2 + rnd() * 2, b = 10 + rnd() * 2, c = 7 + rnd() * 2;
  return `<svg width="26" height="24" viewBox="0 0 26 24"><path d="M${a} ${b} C ${a + 3} ${b + 2}, ${c} ${b + 6}, ${c + 1} ${b + 8} C ${c + 5} ${b - 2}, 16 3, 24 ${1 + rnd() * 2}" stroke="#1F7A47" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const sq = (on) => `<span class="sq">${on ? tick() : ""}</span>`;

function mast(urdu) {
  return `<header class="mast">
    <div class="name">${logo(46)}<div><b>PakGuide</b><small>Govt. paperwork, decoded</small></div></div>
    <div class="mid">Lahore edition · Sat 15 Nov 2026 · Free of charge</div>
    <div class="lang"><span class="${urdu ? "" : "on"}">ENG</span><span class="u ${urdu ? "on" : ""}">اردو</span></div>
  </header>`;
}
function tabs(active) {
  const t = [["cnic", "01", "CNIC renewal"], ["passport", "02", '<span class="ur">بچے کا پاسپورٹ</span>'], ["licence", "03", "Learner licence"], ["track", "04", "My checklist"]];
  return `<nav class="tabs">${t.map(([k, n, l]) => `<span class="tab ${k === active ? "on" : ""}"><b>File ${n}</b>${l}</span>`).join("")}<span class="tab add hide-m">+ open a new file</span></nav>`;
}
function write(ph, urdu) {
  return `<div class="write"><div class="field"><span class="${urdu ? "ur" : ""}">${ph}</span><span class="hide-m">🎙</span></div><span class="btn">Submit →</span></div>`;
}

const views = {
  brand() {
    const ring = "PAKGUIDE · کاغذی کام آسان · EST. 2022 · ";
    return `<div style="height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--folder);position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(90,70,30,0.05) 0 2px, transparent 2px 5px)"></div>
      <div style="display:grid;place-items:center;position:relative">
        <svg width="460" height="460" viewBox="0 0 460 460" style="transform:rotate(-8deg)">
          <defs><path id="c" d="M230 230 m-170 0 a170 170 0 1 1 340 0 a170 170 0 1 1 -340 0"/></defs>
          <circle cx="230" cy="230" r="212" fill="none" stroke="#0E3B24" stroke-width="7"/>
          <circle cx="230" cy="230" r="196" fill="none" stroke="#0E3B24" stroke-width="2"/>
          <circle cx="230" cy="230" r="132" fill="none" stroke="#0E3B24" stroke-width="2"/>
          <text font-family="Type" font-size="27" font-weight="600" letter-spacing="7" fill="#0E3B24"><textPath href="#c">${ring}${ring}</textPath></text>
          <circle cx="230" cy="230" r="131" fill="#FBF8EE"/><g transform="translate(149 144) scale(3.4)">${logo(48).replace(/<svg[^>]*>|<\/svg>/g, "")}</g>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:18px;padding-right:80px;position:relative">
        <div class="type" style="font-size:13px;letter-spacing:.16em;color:#6B5A33">FORM PG-1 · BRAND SHEET</div>
        <div style="font-size:104px;font-weight:700;letter-spacing:-0.04em;line-height:.9">PakGuide</div>
        <div class="ur" style="font-size:38px;line-height:1.3;text-align:left;direction:rtl;align-self:flex-start">پاک گائیڈ — ہر کاغذی کام، قدم بہ قدم</div>
        <div style="font-size:22px;font-style:italic;max-width:440px;line-height:1.4;color:#3E3417">Every government form, explained in plain words and in your language.</div>
        <div style="display:flex;gap:0;margin-top:10px;border:1.5px solid #0E3B24;width:max-content">
          ${[["#0E3B24","Ink"],["#1F7A47","Stamp"],["#FBF8EE","Sheet"],["#D8C59A","Folder"],["#C9483A","Margin"],["#F4E27A","Marker"]].map(([c,n]) => `<div style="width:74px"><div style="height:58px;background:${c};border-right:1.5px solid #0E3B24"></div><div class="type" style="font-size:10.5px;padding:5px 6px;border-top:1.5px solid #0E3B24;border-right:1.5px solid #0E3B24;background:#FBF8EE">${n}</div></div>`).join("")}
        </div>
      </div></div>`;
  },

  home() {
    return `${mast(false)}<div class="front">
      <div>
        <div class="kicker">The people's paperwork desk</div>
        <h1>Every government form, <em>explained</em> before you queue.</h1>
        <p class="deck">Ask in English or Urdu. PakGuide writes back the documents to carry, the office to visit and each step in order, so the trip to NADRA is the only one you make.</p>
        <div class="ask"><small>Write your question</small><div class="line">How do I renew my CNIC<i> before it runs out?</i></div><div class="row"><span>or speak it in Urdu 🎙</span><b>ASK →</b></div></div>
        <div class="clip">
          <div><small>Most asked · 1</small>Can I apply for a passport without visiting the office?</div>
          <div><small>Most asked · 2</small>What does a learner licence need in Lahore?</div>
          <div><small>Most asked · 3</small>How do I get a B-form for a newborn?</div>
        </div>
        <div class="notices">
          <div class="nt"><small>Notice · NADRA</small>Saturday counters open 9–1 at all mega centres this month.</div>
          <div class="nt"><small>Notice · DGIP</small>Passport fees revised from 1 Dec. Old receipts stay valid.</div>
          <div class="stamp red rect" style="position:relative;transform:rotate(-5deg);padding:8px 12px;font-size:11px;align-self:center">No agent<br>fees</div>
        </div>
      </div>
      <div class="toc">
        <h3>Index of services</h3>
        <div class="sec">Section A — Identity</div>
        <div class="it">CNIC &amp; smart card<i></i><span>p.02</span></div>
        <div class="it">B-form for children<i></i><span>p.05</span></div>
        <div class="it">Birth certificate<i></i><span>p.07</span></div>
        <div class="sec">Section B — Travel &amp; roads</div>
        <div class="it">Passport, first or renewal<i></i><span>p.10</span></div>
        <div class="it">Driving licence<i></i><span>p.14</span></div>
        <div class="sec">Section C — Records</div>
        <div class="it">Domicile certificate<i></i><span>p.19</span></div>
        <div class="it">Police character certificate<i></i><span>p.22</span></div>
        <div class="it">Property &amp; fard<i></i><span>p.26</span></div>
        <div class="sec">Section D — Welfare</div>
        <div class="it">BISP &amp; Ehsaas status<i></i><span>p.30</span></div>
        <div class="it">Pension &amp; EOBI<i></i><span>p.33</span></div>
        <div class="it">Zakat &amp; Sehat card<i></i><span>p.36</span></div>
        <div class="toc-foot type">Can't find it? Ask in your own words — 214 procedures on file.</div>
      </div>
    </div>`;
  },

  cnic() {
    return `${mast(false)}${tabs("cnic")}<section class="sheet lined"><div class="inner">
      <div class="entry"><div class="mlabel"><b>Q.</b>10:42 am</div><div class="q">My CNIC expires next month. How do I renew it, and do I have to go to an office?</div></div>
      <div class="entry a"><div class="mlabel"><b>A.</b>PakGuide</div>
        <p>You can renew it from home on <span class="hl">NADRA's Pak-ID app</span>. You only need a registration centre if your details have changed.</p>
        <div class="form"><div class="cap"><span>Procedure</span><span>4 steps</span></div>
          <div class="r"><div class="no">01</div><div>Open Pak-ID, choose <i>Renew ID card</i></div><div class="w">Phone</div></div>
          <div class="r"><div class="no">02</div><div>Take photo and fingerprints in the app</div><div class="w">Plain wall, good light</div></div>
          <div class="r"><div class="no">03</div><div>Choose normal, urgent or executive; pay</div><div class="w">Card / mobile wallet</div></div>
          <div class="r"><div class="no">04</div><div>Card arrives by courier</div><div class="w">SMS at each stage</div></div>
        </div>
        <div style="display:flex;gap:34px;align-items:flex-start">
          <ul class="ticks" style="flex:1"><li>${sq(true)}Current CNIC</li><li>${sq(true)}SIM in your name</li><li>${sq(false)}Card or JazzCash</li><li>${sq(false)}Delivery address</li></ul>
          <div class="receipt hide-m"><div class="t">— SUMMARY —</div><div class="lead">Time<i></i>1–4 wks</div><div class="lead">Fee<i></i>by speed</div><div class="lead">Visit<i></i>not needed</div></div>
        </div>
        <div class="next"><span>show the in-person route</span><span>add to my checklist</span><span>my address changed</span></div>
      </div>
      <div class="stamp hide-m" style="width:132px;height:132px;right:60px;top:40px;font-size:12px;transform:rotate(12deg)">Steps<br>checked<br>Nov 2026</div>
      ${write("Ask a follow-up…", false)}
    </div></section>`;
  },

  passport() {
    return `${mast(true)}${tabs("passport")}<section class="sheet lined"><div class="inner">
      <div class="entry"><div class="mlabel"><b>Q.</b>8:15 pm</div><div class="q ur" style="max-width:none">میرے بیٹے کی عمر ۷ سال ہے۔ اس کا پاسپورٹ بنوانے کے لیے کیا چاہیے؟</div></div>
      <div class="entry a ur" style="font-size:21px;line-height:1.8;max-width:none"><div class="mlabel" style="direction:ltr;text-align:right"><b>A.</b>PakGuide</div>
        <p>بچے کے پاسپورٹ کے لیے <span class="hl">ب-فارم</span> اور والدین کے شناختی کارڈ ضروری ہیں۔ بچے کو ساتھ لے جائیں، تصویر وہیں لی جاتی ہے۔</p>
        <div class="form" style="font-size:18px"><div class="cap" style="font-family:Naskh;font-size:15px;letter-spacing:0;text-transform:none"><span>طریقہ کار</span><span>۳ مراحل</span></div>
          <div class="r" style="grid-template-columns:44px 1fr 190px"><div class="no">۰۱</div><div>دفتر میں ٹوکن لیں، فارم وہیں ملے گا</div><div class="w" style="font-family:Naskh;font-size:15px">استقبالیہ</div></div>
          <div class="r" style="grid-template-columns:44px 1fr 190px"><div class="no">۰۲</div><div>بچے کی تصویر اور انگلیوں کے نشان</div><div class="w" style="font-family:Naskh;font-size:15px">کاؤنٹر ۳</div></div>
          <div class="r" style="grid-template-columns:44px 1fr 190px"><div class="no">۰۳</div><div>فیس بینک میں جمع کروائیں، رسید سنبھالیں</div><div class="w" style="font-family:Naskh;font-size:15px">نارمل یا ارجنٹ</div></div>
        </div>
        <ul class="ticks" style="direction:rtl;font-size:19px"><li>${sq(true)}بچے کا ب-فارم (نادرا)</li><li>${sq(true)}والد کا شناختی کارڈ</li><li>${sq(false)}والدہ کا شناختی کارڈ</li><li>${sq(false)}پرانا پاسپورٹ، اگر ہو</li></ul>
        <div style="display:flex;justify-content:flex-end;margin:6px 0 18px"><div class="slip" style="direction:ltr;text-align:left"><div class="l"><b>Regional Passport Office, Garden Town</b><span>3.2 km · open today 9:00 – 16:00</span></div><div class="r"><small>TOKEN №</small><b>047</b></div></div></div>
        <div class="margin-note" style="font-family:Naskh;font-style:normal;font-size:18px">— والدین میں سے ایک کا ساتھ ہونا لازمی ہے</div>
      </div>
      <div class="stamp red rect" style="left:610px;top:452px;padding:10px 16px;font-size:13px;transform:rotate(-7deg)">Bring child<br>in person</div>
      ${write("اپنا سوال یہاں لکھیں…", true)}
    </div></section>`;
  },

  licence() {
    return `${mast(false)}${tabs("licence")}<section class="sheet lined"><div class="inner">
      <div class="entry"><div class="mlabel"><b>Q.</b>9:03 am</div><div class="q">I'm 19 and live in Lahore. What do I need for a learner's licence for a car?</div></div>
      <div class="entry a"><div class="mlabel"><b>A.</b></div>
        <p>From 18 you can get a <span class="hl">learner permit</span>. Apply online or at a licensing centre, then sit a short sign test.</p>
        <ul class="ticks"><li>${sq(true)}Original CNIC + copy</li><li>${sq(true)}Medical certificate</li><li>${sq(false)}Fee receipt</li><li>${sq(false)}Two photos</li></ul>
        <div class="slip" style="margin:4px 0 18px"><div class="l"><b>Licence Centre, Liberty</b><span>1.8 km · Mon–Sat 9–4</span></div><div class="r"><small>TOKEN №</small><b>112</b></div></div>
        <div class="margin-note">Permit lasts six weeks — then book the driving test.</div>
      </div>
      ${write("Write a follow-up…", false)}
    </div></section>`;
  },

  track() {
    const rows = [
      [true, "Check passport and CNIC dates", "both valid · 12 Mar", "Done"],
      [true, "Fill the online renewal form", "photo + signature attached", "Done"],
      [true, "Pay the fee", "card · receipt kept", "Done"],
      [false, "Fingerprints in the app", "about five minutes", "Today"],
      [false, "Wait for delivery", "10–14 working days", "Later"],
    ];
    return `${mast(false)}${tabs("track")}<section class="sheet"><div class="inner">
      <div class="ledger">
        <div>
          <div class="kicker" style="margin-bottom:6px">File 04 · Passport renewal</div>
          ${rows.map(([d, t, s, st], i) => `<div class="lrow ${d ? "done" : ""}"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><span class="t">${t}</span><small>${s}</small></div><span class="st" style="color:${st === "Today" ? "var(--stamp-red)" : "var(--pencil)"}">${st === "Done" ? "" : st}</span>
            ${d ? `<span class="stamp rect" style="right:8px;top:9px;padding:3px 10px;font-size:11px;transform:rotate(${[-6, 4, -3][i]}deg)">Done</span>` : ""}</div>`).join("")}
          <div class="kicker" style="margin-top:34px">Papers clipped to this file</div>
          <div class="docs">
            ${[["Old passport","AB1234567 · exp. 2026"],["CNIC copy","front + back"],["Fee receipt","PSID 0092…31"],["Photo","white background"]].map(([t, m], i) => `<div class="doc" style="transform:rotate(${[-2, 1, -1, 2][i]}deg)"><span class="clipr"></span><b>${t}</b>${m}<i></i><i style="width:70%"></i><i></i><i style="width:50%"></i></div>`).join("")}
          </div>
        </div>
        <div>
          <div class="tally">3<span> / 5</span></div>
          <div class="type" style="font-size:12px;color:var(--pencil);margin:6px 0 22px;letter-spacing:.06em">STEPS COMPLETED · STARTED 12 MAR</div>
          <div class="receipt" style="width:100%"><div class="t">— REMINDERS —</div><div class="lead">CNIC expires<i></i>8 months</div><div class="lead">Licence renewal<i></i>next year</div><div class="lead">Passport check<i></i>2031</div></div>
          <div class="margin-note" style="margin-top:26px;line-height:1.45">Fingerprints are the last thing you do yourself — after that it's just waiting for the courier.</div>
        </div>
      </div>
    </div></section>`;
  },
};
function render() { seed = 3; lid = 0; const k = (location.hash || "#home").slice(1); document.getElementById("root").innerHTML = (views[k] || views.home)(); }
window.addEventListener("hashchange", render); render();
</script>
</body>
